name: Build Docker Image CI

on:
  push:
    branches: [ "master" ]

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    env:
      GITHUB_REF: ${{ github.ref }}
      DOCKER_REGISTRY: ghcr.io
      DOCKER_IMAGE: smip/aleksandr-isokolov-com

    steps:
    - uses: actions/checkout@v4

    - name: Creating envs
      run: |
        echo "IMAGE_TAG=sha-$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "DOCKER_IMAGE_URI=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}" >> $GITHUB_ENV

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v1
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build docker image and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: .Dockerfile
        push: true
        tags: ${{ env.DOCKER_IMAGE_URI }}:${{ env.IMAGE_TAG }},${{ env.DOCKER_IMAGE_URI }}:latest

    - name: Sleep for 10 seconds
      run: sleep 10s
      shell: bash


  webhook:
    runs-on: ubuntu-latest
    needs: [build-image]

    steps:
    - name: Deploy service
      uses: distributhor/workflow-webhook@v3
      with:
        webhook_url: ${{ secrets.DEPLOY_WEBHOOK }}

